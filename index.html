<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chirp — Social Feed</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --surface: #111a27;
      --surface-2: #0d1420;
      --border: #233246;
      --text: #e7edf5;
      --muted: #8b98a5;
      --accent: #1d9bf0;
      --accent-2: #1287d8;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1a2b44, var(--bg) 60%);
      padding: 20px;
    }

    .app {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 320px;
      gap: 20px;
    }

    .panel {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
    }

    .left,
    .right {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-self: start;
      position: sticky;
      top: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      font-weight: 700;
    }

    .brand-mark,
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 700;
      background: linear-gradient(135deg, #1d9bf0, #14b8a6);
    }

    .menu {
      padding: 8px;
      display: grid;
      gap: 4px;
    }

    .menu a {
      color: var(--text);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 500;
    }

    .menu a:hover,
    .menu a.active { background: rgba(29, 155, 240, 0.14); color: var(--accent); }

    .btn-primary {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #06131f;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:hover { background: var(--accent-2); }

    .left .btn-primary { margin: 0 8px 8px; }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }

    .profile small,
    .subtle { color: var(--muted); }

    main {
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(8, 12, 18, 0.86);
      backdrop-filter: blur(10px);
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }

    .tabs { display: flex; gap: 8px; }

    .tabs button {
      border: 0;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .tabs button.active { background: rgba(29, 155, 240, 0.15); color: var(--accent); }

    .composer {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 14px;
    }

    .row { display: flex; gap: 12px; }

    textarea {
      width: 100%;
      min-height: 80px;
      border: 0;
      resize: none;
      color: var(--text);
      background: transparent;
      font: inherit;
      outline: none;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; color: var(--muted); font-size: .82rem; }

    .composer-footer { display: flex; justify-content: space-between; align-items: center; }

    .feed article {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .feed article:last-child { border-bottom: 0; }

    .meta { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }

    .badge {
      color: #34d399;
      background: rgba(52, 211, 153, 0.14);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: .75rem;
      font-weight: 700;
    }

    .tweet-text { margin-top: 6px; line-height: 1.45; }
    .actions { margin-top: 10px; display: flex; gap: 16px; color: var(--muted); font-size: .85rem; }

    .card { padding: 14px; }
    .card h2 { font-size: 1rem; margin-bottom: 10px; }

    .search { padding: 12px 14px; color: var(--muted); }

    .list { display: grid; gap: 10px; }

    .follow-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .follow-meta { display: flex; align-items: center; gap: 8px; }

    .btn-light {
      border: 0;
      border-radius: 999px;
      background: #e8edf4;
      color: #0c1724;
      padding: 7px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 1024px) {
      .app { grid-template-columns: 210px 1fr; }
      .right { display: none; }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .left { position: static; }
      .menu { grid-template-columns: 1fr 1fr; }
      .left .btn-primary { width: calc(100% - 16px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="left">
      <div class="panel brand">
        <div class="brand-mark">◎</div>
        <div>
          <div>Chirp</div>
          <small class="subtle">Stay in the loop</small>
        </div>
      </div>

      <nav class="panel menu" aria-label="Primary">
        <a href="#" class="active">🏠 Home</a>
        <a href="#">🔍 Explore</a>
        <a href="#">🔔 Notifications</a>
        <a href="#">✉️ Messages</a>
        <a href="#">📌 Bookmarks</a>
        <a href="#">👥 Communities</a>
        <a href="#">⚙️ Settings</a>
      </nav>

      <button class="btn-primary">Post</button>

      <div class="panel profile">
        <div class="avatar">AJ</div>
        <div>
          <div><strong>Alex Johnson</strong></div>
          <small>@alexj</small>
        </div>
      </div>
    </aside>

    <main>
      <header class="main-header">
        <h1>Home</h1>
        <div class="tabs">
          <button class="active">For you</button>
          <button>Following</button>
          <button>Spaces</button>
        </div>
      </header>

      <section class="composer">
        <div class="row">
          <div class="avatar">AJ</div>
          <label style="flex:1;">
            <span class="subtle" style="display:block; margin-bottom: 4px;">Compose</span>
            <textarea placeholder="What is happening?!"></textarea>
          </label>
        </div>
        <div class="composer-footer">
          <div class="chips">
            <span class="chip">Photo</span>
            <span class="chip">GIF</span>
            <span class="chip">Poll</span>
            <span class="chip">Schedule</span>
          </div>
          <button class="btn-primary">Post</button>
        </div>
      </section>

      <section class="feed" id="feed"></section>
    </main>

    <aside class="right">
      <div class="panel search">🔎 Search Chirp</div>
      <section class="panel card">
        <h2>Trends for you</h2>
        <div class="list" id="trends"></div>
      </section>
      <section class="panel card">
        <h2>Who to follow</h2>
        <div class="list" id="follows"></div>
      </section>
    </aside>
  </div>

  <template id="tweet-template">
    <article>
      <div class="avatar"></div>
      <div>
        <div class="meta"></div>
        <p class="tweet-text"></p>
        <div class="actions"></div>
      </div>
    </article>
  </template>

  <script>
    const tweets = [
      {
        initials: "LV",
        user: "Lucia Vega",
        handle: "@lucia",
        time: "2h",
        badge: "Trending",
        text: "We shipped our new spaceship UI concept 🚀. Want a design-system breakdown thread?",
        stats: ["💬 148", "🔁 2.4K", "❤️ 9.1K", "📤 Share"]
      },
      {
        initials: "KP",
        user: "Kai Park",
        handle: "@kaipark",
        time: "5h",
        text: "Audio spaces lineup is 🔥 tonight—live chat on product storytelling and launch rituals.",
        stats: ["💬 62", "🔁 912", "❤️ 3.8K", "📤 Share"]
      },
      {
        initials: "MS",
        user: "Maya Singh",
        handle: "@maya",
        time: "8h",
        text: "Morning check-in: focus blocks + zero-notification windows made my day calmer.",
        stats: ["💬 201", "🔁 1.1K", "❤️ 5.4K", "📤 Share"]
      }
    ];

    const trends = [
      ["#DesignSystems", "12.4K posts"],
      ["#SpaceStartups", "8,102 posts"],
      ["#FutureOfWork", "4,899 posts"]
    ];

    const suggestions = [
      ["AR", "Avery Reed", "@averyreed"],
      ["SP", "Sam Patel", "@samp"],
      ["NC", "Nora Chen", "@nora"]
    ];

    function renderFeed() {
      const feed = document.getElementById("feed");
      const template = document.getElementById("tweet-template");

      tweets.forEach((tweet) => {
        const node = template.content.cloneNode(true);
        node.querySelector(".avatar").textContent = tweet.initials;

        const meta = node.querySelector(".meta");
        meta.innerHTML = `<strong>${tweet.user}</strong> <span>${tweet.handle} · ${tweet.time}</span>`;
        if (tweet.badge) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = tweet.badge;
          meta.appendChild(badge);
        }

        node.querySelector(".tweet-text").textContent = tweet.text;

        const actions = node.querySelector(".actions");
        tweet.stats.forEach((item) => {
          const span = document.createElement("span");
          span.textContent = item;
          actions.appendChild(span);
        });

        feed.appendChild(node);
      });
    }

    function renderTrends() {
      const container = document.getElementById("trends");
      trends.forEach(([tag, count]) => {
        const el = document.createElement("div");
        el.innerHTML = `<strong>${tag}</strong><div class="subtle">${count}</div>`;
        container.appendChild(el);
      });
    }

    function renderFollows() {
      const container = document.getElementById("follows");
      suggestions.forEach(([initials, name, handle]) => {
        const row = document.createElement("div");
        row.className = "follow-item";
        row.innerHTML = `
          <div class="follow-meta">
            <div class="avatar" style="width:36px;height:36px;border-radius:12px;">${initials}</div>
            <div><strong>${name}</strong><div class="subtle">${handle}</div></div>
          </div>
          <button class="btn-light">Follow</button>
        `;
        container.appendChild(row);
      });
    }

    renderFeed();
    renderTrends();
    renderFollows();
  </script>
</body>
</html>
