<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Advanced Space Shooter</title>
	<link rel="stylesheet" href="styles/game.css">
</head>
<body>
	<div id="gameContainer">
		<canvas id="gameCanvas" width="960" height="640"></canvas>

		<div id="ui">
			<div class="hud-row">
				<div id="score">Score: 0</div>
				<div id="health">Health: 100</div>
			</div>
			<div class="hud-row hud-secondary">
				<div id="multiplier">Multiplier: x1.00</div>
				<div id="highScore">High Score: 0</div>
			</div>
			<div id="waveBanner"></div>
			<div class="powerup-indicator" id="powerupIndicator"></div>
		</div>

		<div id="startScreen" class="overlay visible">
			<h1>SPACE SHOOTER</h1>
			<p class="subtitle">Survive escalating waves, keep your combo alive, and dominate boss rounds.</p>
			<button id="startButton" type="button">START GAME</button>
			<div id="controls">
				<p><strong>Move:</strong> Arrow Keys / WASD</p>
				<p><strong>Fire:</strong> Hold Space</p>
				<p><strong>Pause:</strong> P</p>
				<p><strong>Tip:</strong> Consecutive kills raise your score multiplier.</p>
			</div>
		</div>

		<div id="pauseScreen" class="overlay">
			<h1>PAUSED</h1>
			<p>Press <strong>P</strong> to resume.</p>
		</div>

		<div id="gameOver" class="overlay">
			<h1>GAME OVER</h1>
			<p id="finalScore"></p>
			<button id="restartButton" type="button">PLAY AGAIN</button>
		</div>
	</div>

	<script src="js/config.js"></script>
	<script src="js/storage.js"></script>
	<script src="js/audio.js"></script>
	<script src="js/utils.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
